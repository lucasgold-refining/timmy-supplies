<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timmy">
<title>Timmy's Supplies</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/manrope-400-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Manrope (OFL, fonts/OFL-Manrope.txt) for all text and numbers, tabular figures. Same layout system as Ledger v9+:
   4/8 px spacing, rem type (follows Samsung's font size), 36 px icon column, proportional cards. */
@font-face{font-family:'Manrope';src:url('fonts/manrope-400-800.woff2') format('woff2');font-weight:400 800;font-style:normal;font-display:swap}
:root{--navy:#1F3A5F;--sky:#A9CCE3;--skydeep:#5B8DB8;--bg:#F3F8FC;--card:#fff;--text:#1B2A3A;--muted:#5A6B7D;--label:#2E4258;--red:#B3364A;--redbg:#FDECEF;--green:#1b7f3b;--greenbg:#e8f5e9;--amber:#8A5300;--amberbg:#FFF1D6;--line:#E1EAF2;--soft:#E7F0F8;--input:#C9D8E6;--shadow:rgba(31,58,95,.10);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--r:14px;--rs:10px;--pad:12px;--ico:36px;--sh:0 1px 2px rgba(31,58,95,.08),0 2px 8px rgba(31,58,95,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.45 "Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-variant-numeric:lining-nums tabular-nums}
button,input,select,textarea{font-family:inherit}
header{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + var(--s2)) var(--s3) var(--s2) var(--s4);position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px}
header h1{margin:0;font-size:1.375rem;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
header h1 .hi{font-size:1.25rem;line-height:1}
header h1 small{font-weight:600;color:var(--sky);font-size:.9375rem}
main{padding:var(--s3) var(--s3) calc(88px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-width:0;border:0;background:none;padding:8px 2px 10px;font-size:.6875rem;white-space:nowrap;color:var(--muted);min-height:58px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button .ic{font-size:1.25rem;line-height:1}
nav button.on{color:var(--navy);font-weight:800}
.card{background:var(--card);border-radius:var(--r);padding:var(--pad);margin-bottom:var(--s2);box-shadow:var(--sh)}
.card h2{margin:0 0 var(--s2);font-size:1.0625rem;font-weight:800}
h3{font-size:.8125rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:var(--s4) 0 var(--s2)}
.lbl{font-size:.8125rem;font-weight:600;color:var(--muted);line-height:1.3}
.muted{color:var(--muted);font-size:.8125rem}
.big{font-size:clamp(1.5rem,1.05rem + 1.9vw,1.875rem);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.mid{font-size:clamp(1.125rem,.95rem + .8vw,1.3125rem);font-weight:800;line-height:1.2}
.row{display:flex;align-items:center;gap:var(--s3)}
.grow{flex:1;min-width:0}
.ico{flex:none;width:var(--ico);height:var(--ico);border-radius:var(--rs);background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:1.125rem;line-height:1}
.hero{border-left:3px solid var(--skydeep);padding:var(--s4) var(--pad) var(--s4) calc(var(--pad) - 3px);background:linear-gradient(135deg,#fff 55%,var(--soft))}
.hero .ico{background:var(--navy)}
.hero.alert{border-left-color:var(--red);background:linear-gradient(135deg,#fff 55%,var(--redbg))}
.hero.alert .ico{background:var(--red)}
.needs{margin-top:var(--s2);display:flex;flex-wrap:wrap;gap:var(--s1) var(--s2);margin-left:calc(var(--ico) + var(--s3))}
.needs span{font-size:.8125rem;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
.ibox{background:var(--card);border-radius:var(--r);margin-bottom:var(--s2);box-shadow:var(--sh);overflow:hidden}
.irow{display:flex;align-items:center;gap:var(--s3);width:100%;padding:var(--pad);border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.irow .nm{display:block;font-weight:700;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .sub{display:block;font-size:.8125rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.irow .qty{flex:none;text-align:right;line-height:1.15}
.irow .qty b{font-size:1.125rem;font-weight:800;white-space:nowrap}
.irow .qty small{display:block;font-size:.75rem;color:var(--muted);font-weight:600;white-space:nowrap}
.chev{flex:none;width:20px;color:var(--muted);font-size:.875rem;text-align:center;transition:transform .15s}
.ibox.open .chev{transform:rotate(180deg);color:var(--navy)}
.pill{display:inline-block;font-size:.6875rem;font-weight:800;letter-spacing:.02em;border-radius:99px;padding:1px 8px;margin-right:6px;vertical-align:1px;white-space:nowrap}
.pill.out,.pill.low{background:var(--redbg);color:var(--red)}
.pill.soon{background:var(--amberbg);color:var(--amber)}
.pill.ok{background:var(--greenbg);color:var(--green)}
.pill.unknown{background:var(--soft);color:var(--muted)}
.ibox.st-low,.ibox.st-out{box-shadow:inset 3px 0 0 var(--red),var(--sh)}
.ibox.st-soon{box-shadow:inset 3px 0 0 #E0A030,var(--sh)}
.ipanel{border-top:1px solid var(--line);padding:var(--s2) var(--pad) var(--pad)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:2px var(--s3);font-size:.8125rem;margin:var(--s1) 0 0}
.dl dt{color:var(--muted);font-weight:600}
.dl dd{margin:0;text-align:right;font-weight:700;min-width:0;overflow-wrap:anywhere}
.pbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2);margin-top:var(--s3)}
.pbtns .btn{margin:0;min-height:44px;font-size:.875rem;padding:var(--s2) var(--s1)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:var(--s3) var(--s4);font-size:1rem;font-weight:700;min-height:48px;margin-top:var(--s3);background:var(--navy);color:#fff;cursor:pointer;line-height:1.25}
.btn.sky{background:#3E6E99;color:#fff;font-weight:800}
.btn.light{background:var(--soft);color:var(--navy)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.sm{display:inline-block;width:auto;min-height:40px;padding:var(--s2) var(--s3);margin:0;font-size:.8125rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.row2 .btn{margin-top:var(--s2);padding:var(--s3) var(--s2)}
.warn{display:block;width:100%;border:0;text-align:left;background:var(--amberbg);color:var(--amber);border-radius:var(--r);padding:var(--s3);font:inherit;font-weight:600;font-size:.875rem;line-height:1.4;margin-bottom:var(--s2);cursor:pointer}
label{display:block;font-size:.8125rem;font-weight:600;margin:var(--s3) 0 var(--s1);color:var(--label)}
label .dh{font-weight:500;color:var(--muted)}
input,select,textarea{width:100%;font-size:1rem;padding:10px var(--s3);border:1px solid var(--input);border-radius:var(--rs);background:#fff;min-height:48px;color:var(--text)}
textarea{min-height:140px;font-size:.8125rem;font-family:ui-monospace,Menlo,monospace}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:9px;padding:var(--s2) var(--s1);font-size:.875rem;font-weight:700;background:none;color:var(--muted);min-height:44px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 2px rgba(31,58,95,.14)}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{border:1.5px solid var(--input);background:#fff;border-radius:var(--rs);min-height:44px;padding:var(--s2) var(--s3);font-size:.9375rem;font-weight:700;color:var(--text);cursor:pointer}
.chip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.igrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s2)}
.ichip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;padding:var(--s2) var(--s1);border:1.5px solid var(--input);background:#fff;border-radius:var(--rs);font:inherit;color:var(--text);cursor:pointer;min-width:0}
.ichip .ce{font-size:1.375rem;line-height:1}
.ichip .cn{font-size:.75rem;font-weight:700;max-width:100%;text-align:center;line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ichip.on{border-color:var(--navy);background:var(--navy);color:#fff}
.igridwrap{container-type:inline-size}
@container (max-width:17rem){.igrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);align-items:end}
.qrow .seg{grid-template-columns:repeat(2,auto)}
.qrow .seg button{padding:var(--s2) var(--s3)}
.hint{font-size:.8125rem;color:var(--muted);margin-top:var(--s1);min-height:1.2em}
.item{display:flex;gap:var(--s3);align-items:center;padding:var(--s3) 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .body{flex:1;min-width:0}
.item .t{font-weight:700;font-size:.9375rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .body .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amtc{font-weight:800;font-size:.9375rem;white-space:nowrap;text-align:right}
.item .acts{display:flex;gap:var(--s1)}
.item .acts button{border:0;background:var(--soft);border-radius:var(--rs);min-width:40px;min-height:40px;font-size:1rem;cursor:pointer}
.item .acts button.del{background:var(--redbg)}
.card.list{padding-top:0;padding-bottom:0}
.plus{color:var(--green)}.minus{color:var(--red)}
.bar{height:4px;border-radius:99px;background:var(--line);margin-top:var(--s1);overflow:hidden}
.bar i{display:block;height:100%;background:var(--skydeep);border-radius:99px}
.exv{flex:none;min-width:6.5em;text-align:right;font-weight:800;font-size:.9375rem;white-space:nowrap}
.exv .pct{display:block;font-size:.75rem;font-weight:600;color:var(--muted)}
.mpick{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:var(--s2);margin:0 0 var(--s3)}
.mpick button{border:0;background:var(--card);color:var(--navy);border-radius:var(--rs);min-height:44px;font-size:1.25rem;font-weight:800;box-shadow:var(--sh);cursor:pointer}
.mpick button:disabled{opacity:.35;cursor:default}
.mpick .ml{text-align:center;font-weight:800}
.fbar{display:flex;gap:var(--s2);overflow-x:auto;padding:2px 0 var(--s2);margin-bottom:var(--s1);scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fbar .chip{flex:none;min-height:40px;padding:var(--s1) var(--s3);font-size:.875rem;border-radius:99px}
#homeTabs{margin:0 calc(-1 * var(--s3)) var(--s2);padding:2px var(--s3) var(--s2)}
#homeTabs .chip{min-height:44px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#homeTabs .chip .tc{font-size:.75rem;font-weight:800;opacity:.7}
.setitem{display:grid;grid-template-columns:var(--ico) minmax(0,1fr) 44px 44px;gap:var(--s2);align-items:center;padding:var(--s2) 0;border-bottom:1px solid var(--line)}
.setitem:last-child{border-bottom:0}
.setitem .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setitem .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:0;background:var(--soft);color:var(--navy);border-radius:var(--rs);min-height:44px;min-width:44px;font-size:1rem;cursor:pointer;padding:0}
.iconbtn:disabled{opacity:.35}
.sw{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin:var(--s3) 0 0;font-size:.9375rem;font-weight:600;color:var(--text);min-height:44px;cursor:pointer}
.sw > span{display:flex;flex-direction:column;min-width:0}
.sw small{font-weight:500;font-size:.75rem;color:var(--muted)}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:46px;height:28px;min-height:0;padding:0;margin:0;border:0;border-radius:99px;background:var(--input);position:relative;cursor:pointer;transition:background .15s}
.sw input::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked{background:var(--navy)}
.sw input:checked::after{transform:translateX(18px)}
.f2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s2)}
.modal{position:fixed;inset:0;background:rgba(15,30,50,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:92vh;overflow:auto;padding:var(--s4) var(--s4) calc(var(--s4) + env(safe-area-inset-bottom))}
.mh{display:flex;justify-content:space-between;align-items:center;gap:var(--s2)}
.mh h2{margin:0;font-size:1.1875rem;font-weight:800}
.x{border:0;background:var(--soft);border-radius:var(--rs);min-width:40px;min-height:40px;font-size:1rem;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--text);color:#fff;padding:10px var(--s4);border-radius:12px;font-size:.875rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90%;text-align:center}
.toast.show{opacity:.94}
.updToast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;border:1px solid var(--sky);padding:10px 16px;border-radius:999px;font:700 .875rem 'Manrope',sans-serif;z-index:41;box-shadow:0 4px 14px rgba(15,30,50,.25);white-space:nowrap;cursor:pointer}
.updToast[hidden]{display:none}
.empty{text-align:center;color:var(--muted);padding:var(--s4) var(--s2);font-size:.875rem}
.dline{display:flex;justify-content:space-between;gap:var(--s3);font-size:.875rem;padding:2px 0}
.dline span{color:var(--muted)}
.ver{text-align:center;margin:var(--s4) 0}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s2);margin-bottom:var(--s2)}
.duo .card{margin:0}
.tile{display:flex;flex-direction:column;gap:2px;border:0;font:inherit;color:inherit;text-align:left;min-width:0}
button.tile{cursor:pointer}
.tile .mid{font-size:clamp(1rem,.85rem + .7vw,1.1875rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .muted{font-size:.75rem;line-height:1.3}
#monthCard .muted{color:var(--navy);font-weight:700}
.item.subcat{padding:var(--s1) 0 var(--s2) calc(var(--ico) + var(--s3));border-bottom:0}
.item.subcat .t{font-weight:600;font-size:.875rem;color:var(--label)}
.item.subcat .exv{font-weight:700;font-size:.875rem;color:var(--label)}
.item.cat:not(:first-child){border-top:1px solid var(--line)}
button.item.mrow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit;text-align:left;cursor:pointer}
button.item.mrow:last-child{border-bottom:0}
button.item.mrow.on .t{color:var(--navy);font-weight:800}
button.item.mrow.on .bar i{background:var(--navy)}
.chip.none{border-style:dashed;font-weight:600}
.chip.none.on{border-style:solid}
.cathd{display:flex;align-items:center;gap:var(--s2);text-transform:none;letter-spacing:0;font-size:.9375rem;color:var(--label);margin:var(--s4) 0 var(--s2)}
.cathd span{font-size:1rem;line-height:1}
.subhd{font-size:.75rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:var(--s3) 0 var(--s1) var(--s1)}
.setcat{display:grid;grid-template-columns:var(--ico) minmax(0,1fr) 40px 40px 40px;gap:var(--s2);align-items:center;padding:var(--s2) 0;border-bottom:1px solid var(--line)}
.setcat:last-child{border-bottom:0}
.setcat .iconbtn{min-width:40px}
.setcat .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setcat .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catform{display:grid;grid-template-columns:4.5rem minmax(0,1fr);gap:var(--s2)}
.setsub{display:grid;grid-template-columns:minmax(0,1fr) 40px 40px 40px;gap:var(--s2);align-items:center;padding:var(--s2) 0 0}
.setsub input{min-height:44px;padding:var(--s2) var(--s3)}
.setsub .iconbtn{min-width:40px}
.subn{padding:2px 0 var(--s2) var(--s1);border-bottom:1px solid var(--line)}
#subList .subn:last-child{border-bottom:0}
.iconbtn.del{background:var(--redbg);color:var(--red)}
.newrow{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:var(--s2);align-items:center;margin-top:var(--s2)}
.newrow[hidden]{display:none}
.newrow .btn.sm{min-height:44px;padding:0 var(--s4)}
.btn[hidden],.chip[hidden]{display:none}
.item.subcat.sub .t{font-weight:700;color:var(--text)}
.item.subcat.subitem{padding-left:calc(var(--ico) + var(--s3) + var(--s4))}
.item.subcat.subitem .t,.item.subcat.subitem .exv{font-weight:600;color:var(--muted)}
</style>
</head>
<body>
<header><h1><span class="hi">🍼</span>Timmy <small>supplies</small></h1></header>
<main id="app"></main>
<nav>
  <button data-v="home" class="on"><span class="ic">🏠</span>Home</button>
  <button data-v="add"><span class="ic">➕</span>Log</button>
  <button data-v="spend"><span class="ic">📊</span>Spending</button>
  <button data-v="hist"><span class="ic">📜</span>History</button>
  <button data-v="set"><span class="ic">⚙️</span>Settings</button>
</nav>
<div class="toast" id="toast"></div>
<button class="updToast" id="updToast" hidden>New version ready · Tap to update</button>
<script>
'use strict';
const APP_V = 1;
const KEY = 'timmy-supplies-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DIAPER_SIZES = ['NB', 'S', 'M', 'L', 'XL', 'XXL'];
// Starter list. Every field is editable in Settings; nothing here is a real stock figure.
// Starter categories (all editable in Settings → Categories). Items point at a category id and an optional subcategory id.
const DEFAULT_CATS = [
  { name: 'Hygiene & Care', icon: '🧴', subs: ['Diapers & Wipes', 'Bath Items', 'Skin Care'] },
  { name: 'Feeding', icon: '🍼', subs: ['Formula', 'Solids'] },
  { name: 'Health', icon: '💊', subs: ['Vitamins', 'Medicine'] },
  { name: 'Clothing', icon: '👕', subs: [] },
  { name: 'Other', icon: '📦', subs: [] }
];
const DEFAULT_ITEMS = [
  { name: 'Rascal XL diapers', icon: '🧷', cat: 'Hygiene & Care', sub: 'Diapers & Wipes', unit: 'pcs', pack: 40, low: 20, perDay: 0, sized: true, size: 'XL' },
  { name: 'Wipes', icon: '🧻', cat: 'Hygiene & Care', sub: 'Diapers & Wipes', unit: 'packs', pack: 0, low: 2, perDay: 0 },
  { name: 'Rash cream', icon: '🩹', cat: 'Hygiene & Care', sub: 'Skin Care', unit: 'tubes', pack: 0, low: 1, perDay: 0 },
  { name: 'Baby wash', icon: '🧴', cat: 'Hygiene & Care', sub: 'Bath Items', unit: 'bottles', pack: 0, low: 1, perDay: 0 },
  { name: 'Similac TummiCare 1-3', icon: '🍼', cat: 'Feeding', sub: 'Formula', unit: 'cans', pack: 0, low: 1, perDay: 0 },

  save(); await snapChain; closeModal(); go('home'); toast(msg);
}
async function checkRecovery() {
  await loadSnaps();
  lastSnapCmp = SNAPS[0] ? cmpOf(SNAPS[0].data) : null; lastSnapTs = SNAPS[0] ? SNAPS[0].ts : 0;
  if (!freshStart || !SNAPS.length || $('#modal') || /import=/.test(location.hash)) return;
  const s = SNAPS[0];
  const sh = openModal(mhead('Restore your data?') + `<div id="recoverModal"><p>This app’s storage is empty, but an auto backup was found on this phone:</p>
    <div class="card" style="background:var(--soft)"><b>${fmtDT(s.ts)}</b><div class="muted">${esc(snapSummary(s))}</div></div>
    <button class="btn" id="recoverYes">Restore it</button><button class="btn light" id="recoverNo">Not now</button></div>`);
  sh.querySelector('#recoverNo').onclick = closeModal;
  sh.querySelector('#recoverYes').onclick = async () => { const d = parseBackup(s.data); if (d) { S = Object.assign(defaultState(), d); save(); await snapChain; closeModal(); go('home'); toast('Data restored from auto backup'); } };
}
const FSA = typeof window.showSaveFilePicker === 'function';
let fileHandle = null, filePerm = null, fileTimer = null;
let FM; try { FM = JSON.parse(localStorage.getItem(FILE_META_KEY)) || {}; } catch (e) { FM = {}; }
const saveFM = () => localStorage.setItem(FILE_META_KEY, JSON.stringify(FM));
const fileNeedsPerm = () => !!fileHandle && filePerm !== 'granted' && FM.status !== 'missing';
function scheduleFileWrite() { if (!fileHandle) return; clearTimeout(fileTimer); fileTimer = setTimeout(() => writeFile(), 1000); }
async function writeFile() {
  if (!fileHandle) return false;
  try {
    filePerm = fileHandle.queryPermission ? await fileHandle.queryPermission({ mode: 'readwrite' }) : 'granted';
    if (filePerm !== 'granted') { FM.status = 'perm'; saveFM(); if ((view === 'home' || view === 'set') && !$('#modal')) render(); return false; }
    const w = await fileHandle.createWritable(); await w.write(backupText()); await w.close();
    FM.name = fileHandle.name || FM.name; FM.lastSaved = Date.now(); FM.status = 'ok'; FM.error = ''; saveFM();
  } catch (e) {
    const missing = e && (e.name === 'NotFoundError' || e.name === 'NotReadableError' || e.name === 'InvalidStateError');
    FM.status = missing ? 'missing' : (e && e.name === 'NotAllowedError' ? 'perm' : 'error'); FM.error = e && e.message ? String(e.message) : String(e); saveFM();
    if (e && e.name === 'NotAllowedError') filePerm = 'prompt';
  }
  if ((view === 'set' || view === 'home') && !$('#modal')) render();
  return FM.status === 'ok';
}
async function setupFile() {
  try {
    const h = await window.showSaveFilePicker({ suggestedName: 'timmy-supplies-backup.json', types: [{ description: 'Timmy supplies backup', accept: { 'application/json': ['.json'] } }] });
    fileHandle = h; filePerm = 'granted'; FM = { name: h.name || 'timmy-supplies-backup.json', status: 'ok', lastSaved: null }; saveFM();
    try { await kvSet('fileHandle', h); } catch (e) {}
    if (await writeFile()) toast('Phone backup file set up ✓');
  } catch (e) { if (!e || e.name !== 'AbortError') toast('Couldn’t set up the backup file'); }
}
async function grantFilePerm() {
  if (!fileHandle) return;
  try { filePerm = await fileHandle.requestPermission({ mode: 'readwrite' }); } catch (e) { filePerm = 'denied'; }
  if (filePerm === 'granted') { if (await writeFile()) toast('Saving backups to your phone ✓'); } else { render(); toast('Permission not given — backups to the phone file are paused'); }
}
async function forgetFile() { fileHandle = null; filePerm = null; FM = {}; saveFM(); try { await kvDel('fileHandle'); } catch (e) {} render(); }
async function initFileBackup(h) {
  fileHandle = h || null; if (!fileHandle) { filePerm = null; return; }
  try { filePerm = fileHandle.queryPermission ? await fileHandle.queryPermission({ mode: 'readwrite' }) : 'granted'; } catch (e) { filePerm = 'prompt'; }
  if (filePerm === 'granted' && FM.status !== 'ok') await writeFile();
  if (!$('#modal')) render();
}
async function restoreFromFile() {
  let text;
  try {
    if (typeof window.showOpenFilePicker === 'function') { const [h] = await window.showOpenFilePicker({ types: [{ description: 'Timmy supplies backup', accept: { 'application/json': ['.json'] } }] }); text = await (await h.getFile()).text(); }
    else { text = await new Promise((res, rej) => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'application/json,.json'; i.onchange = () => i.files[0] ? i.files[0].text().then(res, rej) : rej(new Error('none')); i.click(); }); }
  } catch (e) { if (!e || e.name !== 'AbortError') toast('Couldn’t read that file'); return; }
  const d = parseBackup(text); if (!d) { toast('That file isn’t a Timmy supplies backup'); return; }
  if (!confirm(`Replace all current data with this backup file?\n${sumTxt(d)}`)) return;
  await applyRestore(d, 'Backup file restored', true);
}
function downloadBackup() {
  const blob = new Blob([backupText()], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `timmy-supplies-backup-${todayISO()}.json`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); markBackup(); toast('Backup file saved to Downloads');
}
function fileCardHTML() {
  let h = `<div class="card" id="fileCard"><h2>Phone backup file</h2>`;
  if (!FSA) return h + `<div class="muted">Saves a backup file (.json) you can keep in Downloads or send to yourself.</div><button class="btn" id="downloadBk">💾 Save backup file</button><button class="btn light" id="restoreFile">📂 Restore from phone file</button></div>`;
  if (!fileHandle) h += `<div class="muted">Pick a place once (e.g. Documents) and the app keeps an up-to-date backup file there after every change.</div><button class="btn" id="setupFile">📁 Set up phone backup file</button>`;
  else {
    const st = FM.status === 'missing' ? '⚠️ File was moved or deleted — set it up again' : fileNeedsPerm() || FM.status === 'perm' ? '⏸️ Needs permission — tap “Allow saving”' : FM.status === 'error' ? '⚠️ Last save failed — ' + esc(FM.error || '') : '✓ Saving after every change';
    h += `<div class="dline"><span>File</span><b>${esc(FM.name || fileHandle.name || '')}</b></div><div class="dline"><span>Last saved</span><b>${FM.lastSaved ? fmtDT(FM.lastSaved) : '—'}</b></div><div class="muted" style="margin-top:6px">${st}</div>
      ${FM.status === 'missing' ? '<button class="btn" id="setupFile">📁 Set up phone backup file again</button>' : fileNeedsPerm() ? '<button class="btn" id="allowFile">Allow saving</button>' : '<button class="btn light" id="saveFileNow">Save now</button>'}
      <div class="row2"><button class="btn light" id="changeFile">Change file</button><button class="btn light" id="forgetFile">Stop</button></div>`;
  }
  return h + `<button class="btn light" id="restoreFile">📂 Restore from phone file</button></div>`;
}
function bindBackupStores() {
  const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
  on('setupFile', setupFile); on('changeFile', setupFile); on('allowFile', grantFilePerm);
  on('saveFileNow', async () => { if (await writeFile()) toast('Saved to phone file'); });
  on('forgetFile', () => { if (confirm('Stop saving backups to the phone file? (The file itself is not deleted.)')) forgetFile(); });
  on('restoreFile', restoreFromFile); on('downloadBk', downloadBackup);
}
function onDataSaved() { queueSnap(); scheduleFileWrite(); }

// ---- link import (as in Consumables): ?v=N#import=data/<file>.json restores a same-origin file after a confirm ----
async function linkImport() {
  const m = location.hash.match(/import=([\w\-./]+\.json)/); if (!m || m[1].includes('..') || /^\w+:|^\/\//.test(m[1])) return;
  history.replaceState(null, '', location.pathname + location.search);
  try {
    const r = await fetch(m[1], { cache: 'no-store' }); const d = parseBackup(await r.text());
    if (!d) { toast('That import file isn’t valid'); return; }
    if (!confirm(`Load this data into the app?\n${sumTxt(d)}\nThis replaces what’s on this phone (an auto backup is kept first).`)) return;
    await applyRestore(d, 'Data imported', true);
  } catch (e) { toast('Couldn’t load the import file'); }
}

// ---- startup: paint first from localStorage; everything else after first paint ----
render();
const afterPaint = (fn, idle) => requestAnimationFrame(() => setTimeout(() => (idle && window.requestIdleCallback) ? requestIdleCallback(fn, { timeout: 1500 }) : fn(), 0));
afterPaint(() => { snapChain = snapChain.then(checkRecovery).then(linkImport).catch(() => {}); }, !freshStart);
afterPaint(() => { if (FSA) kvGet('fileHandle').then(h => initFileBackup(h)).catch(() => {}); askPersist(); }, true);
let swReg = null, userUpdate = false;
function showUpdate() { $('#updToast').hidden = false; }
$('#updToast').onclick = () => {
  userUpdate = true; const b = $('#updToast'); b.disabled = true; b.textContent = 'Updating…';
  if (swReg && swReg.waiting) { swReg.waiting.postMessage({ type: 'skip-waiting' }); setTimeout(() => location.reload(), 3000); } else location.reload();
};
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (userUpdate && !reloading) { reloading = true; location.reload(); } });
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'index-updated') showUpdate(); });
  afterPaint(() => navigator.serviceWorker.register('sw.js').then(reg => {
    swReg = reg; if (reg.waiting && navigator.serviceWorker.controller) showUpdate();
    reg.addEventListener('updatefound', () => { const w = reg.installing; if (w) w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) setTimeout(() => { if (reg.waiting) showUpdate(); }, 400); }); });
  }).catch(() => {}), true);
}
